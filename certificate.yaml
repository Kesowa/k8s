apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kesowa-cert
  namespace: default
spec:
  secretName: kesowa-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: dev.kesowa.com
  dnsNames:
  - dev.kesowa.com
  - api-dev.kesowa.com
  - cdn-dev.kesowa.com
  - cog-dev.kesowa.com
  - live-dev.kesowa.com
