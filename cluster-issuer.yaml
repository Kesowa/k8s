apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  namespace: cert-manager
spec:
  acme:
    # The ACME server URL (production URL)
    server: https://acme-v02.api.letsencrypt.org/directory
    # Your email address to receive expiration notices and other alerts
    email: abhemanyu@kesowa.com
    # Use the HTTP-01 challenge method to prove domain ownership
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
    - http01:
        ingress:
          class: webapprouting.kubernetes.azure.com
