apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: decompressor-scaler
spec:
  scaleTargetRef:
    name: decompressor
  minReplicaCount: 0
  maxReplicaCount: 2
  triggers:
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: file.decompress.req
      host: amqp://rabbitmq.default.svc.cluster.local:5672
      mode: QueueLength
      value: "1"
      activationValue: "0"
