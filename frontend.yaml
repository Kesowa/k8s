apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 543620115200.dkr.ecr.ap-south-1.amazonaws.com/aru-client:2.0.39
        envFrom:
          - configMapRef:
              name: frontend-config
        ports:
          - name: web
            containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  ports:
    - name: web
      port: 80
      targetPort: web
  selector:
    app: frontend
