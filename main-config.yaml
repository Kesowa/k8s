# Non-secret configuration only.
#
# Every credential that used to live in this file now comes from Kubernetes
# Secrets instead. See secrets.example.yaml and README.md.
#
# Do not add a password, key or connection string containing credentials to this
# file. A ConfigMap is stored in plaintext and is readable by anyone with get
# access on the namespace.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  VITE_COG_URL: "https://cog-aru.kesowa.com"
  VITE_LIVE_URL: "https://live-aru.kesowa.com"
  VITE_RTMP_URL: "rtmp://live-aru.kesowa.com:1935/stream"
  VITE_PUBLIC_URL: "https://aru.kesowa.com"
  VITE_ENV: "production"
  VITE_TITILER_STATIC: "https://cdn-aru.kesowa.com"
  VITE_INSTANCE: "aru"
  VITE_STATIC_URL: "https://cdn-aru.kesowa.com"
  VITE_API_URL: "https://api-aru.kesowa.com"
  VITE_VERSION: "v2.6.2"
  # VITE_MAPBOX_API_KEY, VITE_GOOGLE_API_KEY, VITE_OPENWEATHER_API_KEY and the
  # reCAPTCHA keys come from the frontend-secrets Secret. Note that Vite inlines
  # every VITE_* value into the browser bundle at build time, so these are
  # public once built -- they are Secrets here to keep them out of git, and must
  # additionally be restricted by URL/referrer at the provider.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  RATE_LIMIT: "true"
  PORT: "5011"
  SMTP_USERNAME: "no-reply@kesowa.com"
  SMTP_SERVER: "outlook.office365.com"
  SMTP_PORT: "587"
  API_SERVER: "https://api-aru.kesowa.com"
  PUBLIC_SERVER: "https://aru.kesowa.com"
  CDN_URL: "https://cdn-aru.kesowa.com"
  TITILER_STATIC: "http://cdn-aru.kesowa.com"
  FTP_PORT: "5023"
  FTP_HOST_DEV: "0.0.0.0"
  RESET_PASSWORD_TOKEN_EXPIRE: "3600"
  ARU_INSTANCE: "aru"
  LIVE_URL: "https://live-aru.kesowa.com"
  TITILER_SERVER: "http://titiler:8080"
  MODE: "production"
  TITILER_PUBLIC: "https://cog-aru.kesowa.com"
  RTMP_PUBLIC: "rtmp://live-aru.kesowa.com:1935/stream"
  LOGGER_URL: "http://loki.monitoring.svc.cluster.local:3100"
  AIML_SERVER: "http://host.docker.internal:8008"
  S3_BUCKET_NAME: "kesowa-static-data"
  S3_ENDPOINT: "s3.amazonaws.com"
  S3_REGION: "ap-south-1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zip-config
data:
  S3_BUCKET: "kesowa-static-data"
  S3_ENDPOINT: "s3.amazonaws.com"
  S3_REGION: "ap-south-1"
  S3_PATH_STYLE: "false"
  RUST_LOG: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vod-config
data:
  S3_BUCKET: "kesowa-static-data"
  S3_ENDPOINT: "s3.amazonaws.com"
  S3_REGION: "ap-south-1"
  S3_PATH_STYLE: "false"
  RUST_LOG: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: report-config
data:
  ARU_INSTANCE: "aru"
  TITILER_PUBLIC: "https://cog-aru.kesowa.com"
  CLIENT_URL: "https://aru.kesowa.com"
  S3_BUCKET_NAME: "kesowa-static-data"
  S3_ENDPOINT: "s3.amazonaws.com"
  S3_REGION: "ap-south-1"
  S3_PATH_STYLE: "false"
