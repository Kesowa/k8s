apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: public.ecr.aws/docker/library/rabbitmq:4.2.0-management-alpine
        ports:
          - containerPort: 5672
        env:
          - name: "RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS"
            value: "-rabbit consumer_timeout 86400000"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  ports:
    - port: 5672
  selector:
    app: rabbitmq
