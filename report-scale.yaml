apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: reportgen-scaler
spec:
  scaleTargetRef:
    name: reportgen
  minReplicaCount: 0
  maxReplicaCount: 2
  triggers:
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: report.plot.req
      mode: QueueLength
      value: "1"
      activationValue: "0"
    authenticationRef:
      name: rabbitmq-trigger-auth
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: report.block.req
      mode: QueueLength
      value: "1"
      activationValue: "0"
    authenticationRef:
      name: rabbitmq-trigger-auth
