apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: reportgen-scaler
spec:
  scaleTargetRef:
    name: reportgen
  minReplicaCount: 0
  maxReplicaCount: 2
  triggers:
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: report.plot.req
      host: amqp://admin:admin123@rabbitmq.default.svc.cluster.local:5672
      mode: QueueLength
      value: "1"
      activationValue: "0"
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: report.block.req
      host: amqp://admin:admin123@rabbitmq.default.svc.cluster.local:5672
      mode: QueueLength
      value: "1"
      activationValue: "0"
