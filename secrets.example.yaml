# TEMPLATE ONLY -- every value here is a placeholder.
#
# Copy this to secrets.yaml, fill in real values, and apply it. secrets.yaml is
# git-ignored and must never be committed.
#
#   cp secrets.example.yaml secrets.yaml
#   $EDITOR secrets.yaml
#   kubectl apply -f secrets.yaml
#
# Better still, do not keep a plaintext secrets.yaml at all. Use one of:
#
#   * External Secrets Operator, reading from AWS Secrets Manager. This is the
#     natural fit here, since the cluster already runs on EKS with IAM.
#   * Sealed Secrets, which lets an encrypted manifest be committed safely.
#   * SOPS with KMS, same idea, different tool.
#
# See README.md ("Managing secrets").
#
# stringData is used rather than data so values are written in plain text
# instead of base64. Note that base64 is encoding, not encryption -- a base64
# Secret in git is exactly as exposed as a plaintext one.
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  # MongoDB Atlas connection string, including user and password.
  MONGODB_CONNECTION_STRING: "mongodb+srv://USER:PASSWORD@CLUSTER.mongodb.net/DATABASE?retryWrites=true&w=majority"

  # express-session cookie signing secret. SECURITY CRITICAL: anyone holding
  # this can forge a session for any user. Generate a fresh one per environment:
  #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
  SECRET_KEY: "REPLACE_WITH_RANDOM_32_BYTES"

  # Outbound mail account password.
  SMTP_PASSWORD: "REPLACE_ME"

  # FTP endpoint drones upload to.
  FTP_HOST_PROD: "REPLACE_ME"
  FTP_USERNAME: "REPLACE_ME"
  FTP_PASSWORD: "REPLACE_ME"

  # Google Maps API key used server-side for geocoding and static maps.
  MAP_KEY: "REPLACE_ME"

  # Razorpay payment credentials.
  RAZORPAY_KEY_ID: "REPLACE_ME"
  RAZORPAY_KEY_SECRET: "REPLACE_ME"
  RAZORPAY_HOOK_SECRET: "REPLACE_ME"

  # Structured log sink.
  SEQ_URL: "REPLACE_ME"
  SEQ_KEY: "REPLACE_ME"

  # Object storage. PREFER IRSA: bind a ServiceAccount to an IAM role and drop
  # these two keys entirely, so no long-lived AWS credential exists in the
  # cluster at all. See README.md.
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"

  # Message broker, including credentials.
  RABBITMQ_CONNECTION_STRING: "amqp://USER:PASSWORD@rabbitmq:5672"
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
type: Opaque
stringData:
  # Reminder: Vite inlines every VITE_* value into the built JavaScript, so
  # these end up public in the browser bundle regardless. They are Secrets here
  # to keep them out of git. Actual protection comes from restricting each key
  # at its provider -- Mapbox URL restrictions, Google Maps HTTP referrer
  # restrictions. OpenWeather supports no restriction, so treat that key as
  # spendable by anyone who loads the site.
  VITE_MAPBOX_API_KEY: "pk.REPLACE_ME"
  VITE_GOOGLE_API_KEY: "REPLACE_ME"
  VITE_OPENWEATHER_API_KEY: "REPLACE_ME"
  VITE_SITE_KEY: "REPLACE_ME"
  # reCAPTCHA verification is server-side. Do not put a real reCAPTCHA secret
  # in a VITE_ variable -- it would be published in the bundle.
  VITE_SECRET_KEY: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: worker-secrets
type: Opaque
stringData:
  # Shared by the zip, vod and report workers.
  # Again, prefer IRSA over static keys.
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
  AMQP_ADDR: "amqp://USER:PASSWORD@rabbitmq:5672"
  RABBITMQ_CONNECTION_STRING: "amqp://USER:PASSWORD@rabbitmq:5672"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "REPLACE_ME"
  RABBITMQ_DEFAULT_PASS: "REPLACE_ME"
  # Full URI, used by the KEDA TriggerAuthentication below.
  RABBITMQ_HOST: "amqp://USER:PASSWORD@rabbitmq.default.svc.cluster.local:5672"
---
# Lets KEDA read the broker URI from a Secret instead of having it inline in
# every ScaledObject.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
spec:
  secretTargetRef:
    - parameter: host
      name: rabbitmq-secrets
      key: RABBITMQ_HOST
