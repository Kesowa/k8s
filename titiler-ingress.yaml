apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: titiler-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/group.name: "aru-alp"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:543620115200:certificate/b6c67221-a88c-4425-bc7c-09459702817f
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
spec:
  ingressClassName: alb
  tls:
  - hosts:
    - cog-aru.kesowa.com
    secretName: kesowa-tls
  rules:
  - host: cog-aru.kesowa.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: titiler
            port:
              number: 8080
