apiVersion: apps/v1
kind: Deployment
metadata:
  name: titiler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: titiler
  template:
    metadata:
      labels:
        app: titiler
    spec:
      containers:
      - name: titiler
        image: ghcr.io/developmentseed/titiler@sha256:86d3caa383c6a44752f662f40701b163727226318ba4f3f370f0fe8f660ec69e
        resources:
          requests:
            memory: "1.0Gi"   
            cpu: "0.50"        
          limits:
            memory: "2Gi"   
            cpu: "1.0"        
        env:
          - name: PORT
            value: "8080"
          - name: WORKERS_PER_CORE
            value: "2"
          - name: MAX_WORKERS
            value: "4"
        ports:
          - name: web
            containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: titiler
spec:
  ports:
    - name: web
      port: 8080
      targetPort: web
  selector:
    app: titiler
