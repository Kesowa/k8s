apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: transcoder-scaler
spec:
  scaleTargetRef:
    name: transcoder
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: vod.transcode.req
      mode: QueueLength
      value: "1"
      activationValue: "0"
    authenticationRef:
      name: rabbitmq-trigger-auth
